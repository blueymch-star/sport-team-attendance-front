<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>國小運動代表隊 · 現場秒點名 (田徑/排球)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased select-none pb-20">

  <!-- 頂部精簡 Header (現場點名專用) -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white text-base shadow-xs">
          🏆
        </div>
        <div>
          <h1 class="text-sm font-black text-slate-900 leading-tight">
            校隊現場秒點名
          </h1>
          <p class="text-[10px] text-slate-400 font-mono">
            操場 / 球館現場快速考勤
          </p>
        </div>
      </div>

      <!-- 右側：雲端連線狀態與設定 -->
      <div class="flex items-center space-x-2">
        <button id="btn-sync-now" onclick="window.frontApp.syncWithCloud()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center gap-1">
          <span id="sync-icon">☁️</span>
          <span id="sync-text" class="text-[11px]">同步中</span>
        </button>

        <button onclick="window.frontApp.openConfigModal()" class="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition" title="雲端設定">
          ⚙️
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-2xl mx-auto px-3 sm:px-4 py-3 space-y-3">

    <!-- 田徑隊 / 排球隊 雙校隊大膠囊切換 -->
    <div class="bg-white p-1 rounded-2xl border border-slate-200 shadow-2xs grid grid-cols-2 gap-1">
      <button id="tab-track" onclick="window.frontApp.switchTeam('track')" class="py-2.5 rounded-xl font-black text-sm flex items-center justify-center gap-2 transition bg-blue-600 text-white shadow-sm">
        <span class="text-base">🏃</span>
        <span>田徑代表隊</span>
      </button>
      <button id="tab-volleyball" onclick="window.frontApp.switchTeam('volleyball')" class="py-2.5 rounded-xl font-bold text-sm text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2 transition">
        <span class="text-base">🏐</span>
        <span>排球代表隊</span>
      </button>
    </div>

    <!-- 訓練時段選擇器 (晨操 08:00~08:40 / 午訓 12:40~13:20) -->
    <div class="bg-white rounded-2xl p-3.5 border border-slate-200 shadow-2xs space-y-3">
      <div class="flex items-center justify-between gap-2">
        <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200 flex-1">
          <button id="period-morning" onclick="window.frontApp.switchPeriod('morning')" class="flex-1 py-2 rounded-lg text-xs font-black flex items-center justify-center gap-1.5 transition bg-amber-500 text-white shadow-xs">
            <span>☀️</span>
            <span>晨操 (08:00-08:40)</span>
          </button>
          <button id="period-noon" onclick="window.frontApp.switchPeriod('noon')" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5 transition">
            <span>🌤️</span>
            <span>午訓 (12:40-13:20)</span>
          </button>
        </div>
      </div>

      <!-- 快速批次操作按鈕 -->
      <div class="grid grid-cols-2 gap-2">
        <button onclick="window.frontApp.markAllPresent()" class="py-2.5 bg-emerald-600 active:bg-emerald-700 text-white text-xs font-black rounded-xl shadow-xs transition flex items-center justify-center gap-1.5 active:scale-95">
          <span>⚡</span> 一鍵全員出席
        </button>
        <button onclick="window.frontApp.markAllNoTraining()" class="py-2.5 bg-slate-200 active:bg-slate-300 text-slate-700 text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5 active:scale-95">
          <span>🚫</span> 今日無訓練
        </button>
      </div>

      <!-- 日期滑動橫列 (Date Strip) -->
      <div>
        <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1.5 font-semibold">
          <span>📅 訓練日期選擇</span>
          <span class="text-blue-600">左右滑動選擇 ➔</span>
        </div>
        <div id="date-strip-container" class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none">
          <!-- 動態載入訓練日期晶片 -->
        </div>
      </div>
    </div>

    <!-- 當日當前時段統計面板 -->
    <div class="grid grid-cols-4 gap-2">
      <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-2 text-center">
        <div class="text-[10px] font-bold text-emerald-700">實到</div>
        <div id="stat-present" class="text-xl font-black text-emerald-900">0</div>
      </div>
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-2 text-center">
        <div class="text-[10px] font-bold text-amber-700">請假</div>
        <div id="stat-leave" class="text-xl font-black text-amber-900">0</div>
      </div>
      <div class="bg-rose-50 border border-rose-200 rounded-xl p-2 text-center">
        <div class="text-[10px] font-bold text-rose-700">缺席</div>
        <div id="stat-absent" class="text-xl font-black text-rose-900">0</div>
      </div>
      <div class="bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
        <div class="text-[10px] font-bold text-slate-600">無訓練</div>
        <div id="stat-notrain" class="text-xl font-black text-slate-800">0</div>
      </div>
    </div>

    <!-- 搜尋與年級篩選 -->
    <div class="bg-white rounded-xl p-2.5 shadow-2xs border border-slate-200 flex items-center gap-2">
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-slate-400 text-xs">🔍</span>
        <input id="input-search" type="text" placeholder="搜尋隊員姓名..." oninput="window.frontApp.onSearch(this.value)" class="w-full pl-7 pr-3 py-1.5 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div id="grade-filter-pills" class="flex items-center space-x-1 overflow-x-auto shrink-0">
        <!-- 年級篩選膠囊 -->
      </div>
    </div>

    <!-- 隊員現場秒點名卡片清單 (Touch-Friendly List) -->
    <div id="students-card-list" class="space-y-2">
      <!-- 動態載入隊員點名卡片 -->
    </div>

  </main>

  <!-- 底部固定同步狀態條 -->
  <div class="fixed bottom-2 inset-x-3 max-w-2xl mx-auto z-20 pointer-events-none">
    <div class="bg-slate-900/90 backdrop-blur-md text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg flex items-center justify-between pointer-events-auto border border-slate-700/50">
      <span class="flex items-center gap-1.5 text-[11px]">
        <span id="footer-pulse" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="footer-sync-status">本地已儲存 · Google 試算表連線中</span>
      </span>
      <button onclick="window.frontApp.syncWithCloud()" class="text-blue-300 active:text-blue-100 font-bold text-[11px] ml-2">
        立即傳送 ➔
      </button>
    </div>
  </div>

  <!-- 雲端設定彈窗 (Modal) -->
  <div id="config-modal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="text-base font-black text-slate-900 flex items-center gap-2">
          <span>⚙️</span> 雲端試算表 (GAS) 設定
        </h3>
        <button onclick="window.frontApp.closeConfigModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Google Apps Script Web App API 網址：</label>
          <input id="input-gas-url" type="url" placeholder="https://script.google.com/macros/s/AKfy.../exec" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 font-mono">
          <p class="text-[11px] text-slate-400 mt-1">
            請輸入部署好的 Google Apps Script 網頁應用程式網址。若留空則僅存在手機 LocalStorage。
          </p>
        </div>

        <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 text-[11px] text-blue-800 space-y-1">
          <div class="font-bold">💡 貼心提示：</div>
          <div>1. 點名資料會即時存入 Google 試算表。</div>
          <div>2. 學校電腦本機後台可一鍵從此試算表拉回最新點名大表。</div>
        </div>
      </div>

      <div class="flex items-center justify-end space-x-2 pt-2 border-t">
        <button onclick="window.frontApp.testGasConnection()" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
          測試連線
        </button>
        <button onclick="window.frontApp.saveConfig()" class="px-4 py-2 rounded-xl text-xs font-black bg-blue-600 hover:bg-blue-700 text-white transition">
          儲存設定
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=20260930_v6"></script>
</body>
</html>
